set -g prefix C-q
unbind C-b
bind C-q send-prefix
bind q last-window
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"

# Window movement (vim-style)
bind -r H swap-window -t -1 -d
bind -r L swap-window -t +1 -d

# Ctrl + arrow keys to move windows
bind -r C-Left swap-window -t -1 -d
bind -r C-Right swap-window -t +1 -d

# Renumber all windows (remove gaps in numbering)
bind n move-window -r
