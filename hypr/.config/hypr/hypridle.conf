general {
    lock_cmd = /usr/share/scripts/lockscreen.sh  # lock screen command
}

listener {
    timeout = 300                                # 5min.
    on-timeout = brightnessctl -s set 10 && ddcutil -d 1 setvcp 10 10 && ddcutil -d 2 setvcp 10 10
    on-resume = brightnessctl -r && ddcutil -d 1 setvcp 10 80 && ddcutil -d 2 setvcp 10 80
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener { 
    timeout = 300                                          # 5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300                                # 10min.
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 600                                                     # 15min
    on-timeout = hyprctl dispatch dpms off                            # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r  && ddcutil -d 1 setvcp 10 80 && ddcutil -d 2 setvcp 10 80

}
